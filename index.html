<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>WAFFLE HAHZ GAME</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #121212;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #game {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #121212;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #121212;
            color: white;
            text-align: center;
        }

        #loading h1 {
            margin: 0;
            font-family: Arial Black, Arial, sans-serif;
            font-size: clamp(42px, 10vw, 76px);
            letter-spacing: 2px;
        }

        #loading p {
            margin-top: 15px;
            color: #ffb000;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #loading button {
            margin-top: 35px;
            padding: 18px 40px;
            border: 3px solid white;
            border-radius: 14px;
            background: #ffb000;
            color: #121212;
            font-family: Arial Black, Arial, sans-serif;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div id="loading">
        <h1>WAFFLE HAHZ</h1>
        <p>THE HOUSE ALTERNATIVE</p>

        <button onclick="startGame()">
            START TRAINING
        </button>
    </div>

    <div id="game"></div>

    <script>
        function startGame() {
            document.getElementById('loading').style.display = 'none';
        }
    </script>

    <script type="module" src="/src/main.js"></script>

</body>
</html>

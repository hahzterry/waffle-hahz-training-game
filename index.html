<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#D71920">

    <meta
        name="description"
        content="WAFFLE HAHZ GAME — The House Alternative. Enter the kitchen. Build the order. Beat the clock."
    >

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>WAFFLE HAHZ GAME</title>

    <style>
        :root {
            --red: #D71920;
            --red-dark: #A90000;
            --red-deep: #760000;
            --white: #FFFFFF;
            --cream: #FFF8F2;
            --black: #111111;
            --yellow: #FFD43B;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100%;
            background: var(--red);
        }

        body {
            overflow: hidden;
            font-family:
                Arial Black,
                Impact,
                Arial,
                sans-serif;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        #game {
            position: fixed;
            inset: 0;
            z-index: 1;

            width: 100%;
            height: 100%;
            min-height: 100dvh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 18%,
                    rgba(255,255,255,0.12),
                    transparent 34%
                ),
                linear-gradient(
                    180deg,
                    var(--red) 0%,
                    var(--red-dark) 100%
                );
        }

        #game::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;

            background:
                linear-gradient(
                    135deg,
                    transparent 0 46%,
                    rgba(255,255,255,0.045) 46% 50%,
                    transparent 50% 100%
                );

            background-size: 42px 42px;
            opacity: 0.45;
        }

        #game canvas {
            display: block;
            position: absolute;
            inset: 0;
            z-index: 1;

            margin: auto;
            max-width: 100%;
            max-height: 100%;

            background: transparent !important;
            touch-action: none;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 9999;

            width: 100%;
            height: 100%;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding:
                max(28px, env(safe-area-inset-top))
                24px
                max(28px, env(safe-area-inset-bottom))
                24px;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(255,255,255,0.10),
                    transparent 32%
                ),
                linear-gradient(
                    180deg,
                    var(--red) 0%,
                    var(--red-dark) 100%
                );

            color: var(--white);

            transition:
                opacity 0.35s ease,
                visibility 0.35s ease;
        }

        #loading.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            pointer-events: none;
            user-select: none;
        }

        .shape.one {
            width: 180px;
            height: 180px;
            top: -70px;
            right: -60px;
            border: 22px solid rgba(255,255,255,0.13);
            border-radius: 50%;
            transform: rotate(15deg);
        }

        .shape.two {
            width: 120px;
            height: 120px;
            bottom: 80px;
            left: -50px;
            border: 18px solid rgba(255,255,255,0.10);
            border-radius: 28px;
            transform: rotate(18deg);
        }

        .shape.three {
            width: 70px;
            height: 70px;
            top: 26%;
            left: 8%;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }

        .brand-kicker {
            position: relative;
            z-index: 2;

            margin-bottom: 14px;

            font-size: clamp(18px, 5vw, 28px);
            line-height: 1;

            font-weight: 900;
            letter-spacing: 0.14em;
            text-transform: uppercase;

            color: var(--white);
        }

        #loading h1 {
            position: relative;
            z-index: 2;

            margin: 0;
            max-width: 100%;

            font-size: clamp(58px, 15vw, 125px);
            line-height: 0.82;

            font-weight: 900;
            letter-spacing: -0.065em;

            text-align: center;
            color: var(--white);

            text-shadow:
                7px 7px 0 var(--red-deep);

            transform: rotate(-2deg);
        }

        #loading .tagline {
            position: relative;
            z-index: 2;

            margin: 24px 0 0;
            padding: 9px 16px;

            background: var(--white);
            color: var(--red);

            border-radius: 999px;

            font-size: clamp(15px, 4vw, 23px);
            line-height: 1;

            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;

            box-shadow:
                0 7px 0 var(--red-deep);
        }

        .game-label {
            position: relative;
            z-index: 2;

            margin-top: 42px;

            font-size: clamp(20px, 5vw, 32px);
            line-height: 1;

            font-weight: 900;
            letter-spacing: 0.08em;

            color: var(--white);
            text-transform: uppercase;
            text-align: center;
        }

        .game-subtitle {
            position: relative;
            z-index: 2;

            margin-top: 10px;

            font-family: Arial, sans-serif;
            font-size: clamp(16px, 4vw, 21px);
            line-height: 1.3;

            font-weight: 700;
            color: rgba(255,255,255,0.88);

            text-align: center;
        }

        #loading button {
            position: relative;
            z-index: 3;

            margin-top: 38px;

            width: min(88vw, 440px);
            min-height: 76px;

            padding: 18px 28px;

            border: 5px solid var(--white);
            border-radius: 18px;

            background: var(--white);
            color: var(--red);

            font-size: clamp(24px, 6vw, 34px);
            line-height: 1;

            font-weight: 900;
            letter-spacing: 0.025em;

            cursor: pointer;

            box-shadow:
                0 9px 0 var(--red-deep);

            transition:
                transform 0.12s ease,
                box-shadow 0.12s ease,
                background 0.12s ease;
        }

        #loading button:active {
            transform: translateY(7px);
            box-shadow: 0 2px 0 var(--red-deep);
        }

        .instructions {
            position: relative;
            z-index: 2;

            margin-top: 30px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            font-family: Arial, sans-serif;
            font-size: clamp(13px, 3.5vw, 17px);
            font-weight: 800;

            color: rgba(255,255,255,0.88);

            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .dot {
            width: 7px;
            height: 7px;
            flex: 0 0 7px;

            background: var(--white);
            border-radius: 50%;
        }

        .footer {
            position: absolute;
            z-index: 2;

            left: 24px;
            right: 24px;
            bottom: max(22px, env(safe-area-inset-bottom));

            display: flex;
            justify-content: center;

            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: 800;

            letter-spacing: 0.16em;
            color: rgba(255,255,255,0.55);

            text-align: center;
            text-transform: uppercase;
        }

        #loading-status {
            position: relative;
            z-index: 2;

            margin-top: 22px;

            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: 800;

            letter-spacing: 0.12em;
            text-transform: uppercase;

            color: rgba(255,255,255,0.65);
        }

        .loading-dots::after {
            content: "";
            display: inline-block;
            width: 18px;
            text-align: left;
            animation: dots 1.2s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ""; }
            25%  { content: "."; }
            50%  { content: ".."; }
            75%  { content: "..."; }
            100% { content: ""; }
        }

        @media (max-height: 700px) {
            #loading h1 {
                font-size: clamp(50px, 14vw, 82px);
            }

            .game-label {
                margin-top: 24px;
            }

            #loading button {
                margin-top: 25px;
                min-height: 64px;
            }

            .instructions {
                margin-top: 18px;
            }
        }

        @media (orientation: landscape) and (max-height: 600px) {
            #loading {
                justify-content: flex-start;
                padding-top: 25px;
                overflow-y: auto;
            }

            #loading h1 {
                font-size: 58px;
            }

            .game-label {
                margin-top: 20px;
            }

            #loading button {
                margin-top: 20px;
            }

            .footer {
                position: relative;
                margin-top: 25px;
                bottom: auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div id="loading">

        <div class="shape one"></div>
        <div class="shape two"></div>
        <div class="shape three"></div>

        <div class="brand-kicker">
            THE HOUSE ALTERNATIVE
        </div>

        <h1>
            WAFFLE<br>
            HAHZ
        </h1>

        <div class="tagline">
            THE HOUSE ALTERNATIVE
        </div>

        <div class="game-label">
            WAFFLE HAHZ GAME
        </div>

        <div class="game-subtitle">
            BUILD IT. BEAT THE CLOCK.
        </div>

        <button
            id="start-button"
            type="button"
            onclick="startGame()"
        >
            START TRAINING
        </button>

        <div class="instructions">
            <span>TAP</span>
            <span class="dot"></span>
            <span>BUILD</span>
            <span class="dot"></span>
            <span>SERVE</span>
        </div>

        <div id="loading-status">
            <span class="loading-dots">
                KITCHEN READY
            </span>
        </div>

        <div class="footer">
            WAFFLE HAHZ • TRAINING DAY
        </div>

    </div>

    <div id="game"></div>

    <script>
        function startGame() {
            const loading = document.getElementById('loading');

            if (loading) {
                loading.classList.add('hidden');

                setTimeout(function () {
                    loading.style.display = 'none';
                }, 400);
            }
        }

        window.addEventListener('error', function () {
            const loading = document.getElementById('loading');

            if (loading) {
                loading.style.display = 'flex';
                loading.classList.remove('hidden');

                const status = document.getElementById('loading-status');

                if (status) {
                    status.innerHTML =
                        '<span style="color:#fff;font-weight:900;">KITCHEN LOADING...</span>';
                }
            }
        });
    </script>

    <script
        type="module"
        src="/src/main.js"
    ></script>

</body>
</html>
